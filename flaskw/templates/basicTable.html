<!DOCTYPE html>
<html>
<style>
table, th, td {
  border:1px solid black;
}
</style>
<body>

<h2>Box Table</h2>

<p>
  <a href="{{url_for('create')}}">Create a Box</a>
</p>

<table style="width:100%">
  <tr>
    <th>ID</th>
    <th>Title</th>
    <th>Difficulty</th>
    <th>Created</th>
    <th>Expires</th>
    <th>Payout</th>
    <th>Link</th>
  </tr>
{% for contract in contracts %}
  <tr>
    <td>{{ contract[0] }}</td>
    <td>{{ contract[1] }}</td>
    <td>{{ contract[3] }}</td>
    <td>{{ contract[4] }}</td>
    <td>{{ contract[5] }}</td>
    <td>{{ contract[6] }}</td>
    <td><a href="{{url_for('viewContract', id=contract[0])}}">Open</a></td>
  </tr>
{% endfor %}
</table>

</body>
</html>
